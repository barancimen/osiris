<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osiris</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f2; --panel: #ffffff; --sunk: #efede8; --line: #dedbd3; --line-strong: #c6c2b8;
  --text: #22211e; --muted: #6c695f; --accent: #2b5fa8; --accent-text: #ffffff; --accent-soft: #e3ebf6;
  --good: #2c7a4b; --good-soft: #e1f1e7; --warn: #99610c; --warn-soft: #f8ecd6; --bad: #b3362b; --bad-soft: #f8e3e0;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a; --panel: #212125; --sunk: #1b1b1e; --line: #33333a; --line-strong: #484850;
    --text: #e9e7e2; --muted: #a09d94; --accent: #79a6e6; --accent-text: #10151c; --accent-soft: #24303f;
    --good: #6cc592; --good-soft: #1d3026; --warn: #e0ad5c; --warn-soft: #362b18; --bad: #ee8176; --bad-soft: #3b2220;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 20px; padding: 0 16px 0 4px; height: 48px; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
nav { display: flex; gap: 2px; height: 100%; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 12px; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 6px; }
nav button:hover { color: var(--text); }
nav button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.count { background: var(--sunk); border-radius: 9px; padding: 0 6px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
#jobline { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
main { flex: 1; min-height: 0; overflow: hidden; }
.tab { height: 100%; display: none; }
.tab.on { display: flex; }

/* archive tab */
#archive { overflow-y: auto; justify-content: center; }
.column { width: 100%; max-width: 900px; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.card > h2 { font-size: 13px; font-weight: 650; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; }
.stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat span { color: var(--muted); font-size: 12.5px; }
.source { padding: 10px 0; border-top: 1px solid var(--line); }
.source:first-of-type { border-top: 0; padding-top: 0; }
.source-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.source-head h3 { font-size: 13.5px; font-weight: 600; }
.source-head p { color: var(--muted); font-size: 12.5px; }
.folder { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 0 0; font-size: 13px; }
.folder code { font: 12.5px var(--mono); overflow-wrap: anywhere; }
.folder .note { color: var(--muted); font-size: 12.5px; order: 3; flex-basis: 100%; }
.folder .btn.link { margin-left: auto; }
.folder .note.bad { color: var(--bad); }
.btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; color: var(--text); }
.btn:hover:not(:disabled) { background: var(--sunk); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; padding: 7px 16px; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.link { background: none; border: 0; color: var(--muted); padding: 0 4px; text-decoration: underline; }
.btn kbd { font: 11px var(--mono); color: var(--muted); margin-left: 4px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 20px; }
label.opt { display: flex; align-items: center; gap: 7px; }
label.opt input[type=text], label.opt input[type=number], label.opt select { flex: 1; min-width: 0; }
input[type=text], input[type=number], input[type=search], select { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong); border-radius: 14px; padding: 2px 10px 2px 7px; cursor: pointer; font-size: 13px; }
.chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.chip input { margin: 0; }
details summary { cursor: pointer; color: var(--muted); margin-top: 12px; font-size: 13px; }
details .opts { margin-top: 10px; }
.hint { color: var(--muted); font-size: 12.5px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 2px 0 6px 12px; }
td { text-align: right; padding: 3px 0 3px 12px; border-top: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td.zero { color: var(--line-strong); }
#log { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.5 var(--mono); padding: 8px 10px; height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.status-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

/* two-pane tabs */
.list-pane { width: 40%; min-width: 300px; max-width: 520px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); min-height: 0; }
.list-tools { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; flex: none; }
.segments { display: flex; flex-wrap: wrap; gap: 4px; }
.segments button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--muted); font-size: 13px; }
.segments button:hover { background: var(--sunk); }
.segments button[aria-pressed=true] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.tool-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tool-row select, .tool-row input { min-width: 0; flex: 1; }
.rows { flex: 1; overflow-y: auto; min-height: 0; }
.row { display: block; width: 100%; background: none; text-align: left; border: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row[aria-current=true] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row .title { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.row .sub span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub .right { margin-left: auto; flex: none; }
.row .snippet { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.scorebar { width: 42px; height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; flex: none; }
.scorebar i { display: block; height: 100%; background: var(--bad); }
.more { padding: 10px; text-align: center; }
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; max-width: 420px; }
.empty h3 { color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 12px; }
.detail-head { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; display: flex; flex-direction: column; gap: 6px; }
.detail-head h2 { font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; color: var(--muted); font-size: 12.5px; }
.meta a { color: var(--accent); overflow-wrap: anywhere; }
.decide-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.decide-row input { flex: 1; min-width: 120px; }
.btn[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.view-switch { display: flex; gap: 4px; }
.body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; }
.body.mono { font: 12.5px/1.55 var(--mono); }
.frame { flex: 1; border: 0; width: 100%; min-height: 0; background: #fff; }
.notice { margin: 16px; padding: 10px 12px; background: var(--sunk); border-radius: 6px; color: var(--muted); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.banner { padding: 7px 12px; background: var(--accent-soft); display: flex; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-size: 13px; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
.picker-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.picker-head h3 { font-size: 14px; }
.picker-head input { width: 100%; font: 12.5px var(--mono); }
.picker-list { height: 320px; overflow-y: auto; }
.picker-list button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 14px; cursor: pointer; overflow-wrap: anywhere; }
.picker-list button:hover { background: var(--sunk); }
.picker-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.picker-foot .hint { flex: 1; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin: 2px 0 6px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
.progress-text { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px var(--warn-soft); }
mark.here { background: var(--warn); color: var(--panel); box-shadow: 0 0 0 1px var(--warn); }
.explain { padding: 9px 11px; background: var(--bad-soft); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.explain .actions { gap: 6px; }
.matches { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }
.head-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.retry-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 13px; }
.retry-list .chip { cursor: default; padding-right: 4px; }
.retry-list .chip button { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 14px; line-height: 1; }
#report { width: min(960px, calc(100vw - 32px)); }
.report-list { height: min(60vh, 560px); overflow-y: auto; }
.report-row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 14px; cursor: pointer; color: var(--text); }
.report-row:hover { background: var(--sunk); }
.report-row .change { font: 12.5px var(--mono); overflow-wrap: anywhere; }
.report-row .change del { text-decoration: none; background: var(--bad-soft); color: var(--bad); border-radius: 2px; }
.report-row .change ins { text-decoration: none; background: var(--good-soft); color: var(--good); border-radius: 2px; }
.report-row .context { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.report-row .where { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.sym { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 2px; margin: 0 1px; }
.term { text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; cursor: help; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 6px; display: none; z-index: 10; max-width: calc(100vw - 32px); }
@media (max-width: 760px) {
  .tab.on.split { flex-direction: column; }
  .list-pane { width: 100%; max-width: none; height: 45%; border-right: 0; border-bottom: 1px solid var(--line); }
  #jobline { display: none; }
}
</style>
</head>
<body>
<header>
  <nav role="tablist">
    <button role="tab" data-tab="archive" aria-selected="true">Archive</button>
    <button role="tab" data-tab="review" aria-selected="false">Review <span class="count" id="review-count" hidden></span></button>
    <button role="tab" data-tab="documents" aria-selected="false">Documents</button>
  </nav>
  <div id="jobline"></div>
</header>
<main>
  <section class="tab on" id="archive"><div class="column" id="archive-column"></div></section>
  <section class="tab split" id="review"></section>
  <section class="tab split" id="documents"></section>
</main>
<dialog id="picker"></dialog>
<dialog id="report" aria-label="Cleanup report"></dialog>
<div id="toast" role="status"></div>
<script>
"use strict";
const $ = (s, root = document) => root.querySelector(s);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("aria-") && typeof v === "boolean") { el.setAttribute(k, String(v)); continue; }  // aria-pressed="true", not ""
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value" || k === "checked" || k === "disabled" || k === "hidden") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
}
function fill(el, ...kids) { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }
const fmt = n => (n ?? 0).toLocaleString("en-US");
const shortChars = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n ?? 0);
function toast(text) { const t = $("#toast"); t.textContent = text; t.style.display = "block"; clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 3500); }
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!res.ok) { const text = await res.text(); throw new Error(text || res.statusText); }
  return res.json();
}
const guarded = fn => async (...args) => { try { return await fn(...args); } catch (e) { toast(e.message); } };

/* ---- tabs ---- */
let currentTab = "archive";
function showTab(name) {
  currentTab = name;
  if (name !== "documents" || !location.hash.startsWith("#documents/")) setHash(name);
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.tab === name);
  for (const s of document.querySelectorAll(".tab")) s.classList.toggle("on", s.id === name);
  if (name === "review") Review.load();
  if (name === "documents") Docs.load();
}
for (const b of document.querySelectorAll("nav button")) b.addEventListener("click", () => showTab(b.dataset.tab));

/* ---- explanations, shown when you hover ---- */
const HELP = {
  // tabs
  "tab-archive": "Choose what to save, then turn it into searchable text.",
  "tab-review": "Look over documents whose text might have come out garbled, and decide what to do with each.",
  "tab-documents": "Browse and search everything you've saved.",
  "review-count": "Documents waiting for you to look at them.",
  // archive tab
  start: "Go through everything you've added, and fetch or read whatever isn't saved yet. Anything already saved is skipped, so it's fine to press this again.",
  stop: "Pause the current job. Everything done so far is kept, and starting again carries on from there. Press again to stop right away.",
  "review-scan": "Look through your saved documents for text that came out garbled, like broken characters or \"please enable JavaScript\" pages. This only reads them, it doesn't change anything.",
  export: "Put all your saved documents into one file, corpus.jsonl, for other tools to load. Documents you marked Bad are left out.",
  "add-folder": "Pick a folder on this computer to include.",
  "remove-folder": "Stop including this folder. Nothing inside it is touched.",
  ocr: "Some PDFs are just pictures of pages, with no text inside. This reads the words off the pictures (that's OCR). It's slow, so it runs after everything else.",
  ocr_lang: "The languages your scanned PDFs are in, joined with +, like eng+tur. Each language needs its Tesseract language pack installed.",

  retry_failed: "Give every link that failed before another try. Without this, failed links are left alone.",
  review_after: "When archiving is done, check for garbled text right away.",
  advanced: "Settings most people never need to touch.",
  cookies: "A file with your browser's cookies. With it, osiris can open pages as you see them when you're logged in. Keep this file private.",
  user_agent: "How your browser introduces itself to websites. Copy it from the same browser the cookies came from, or some sites won't accept them.",
  render: "For pages that block plain downloads or need JavaScript, open them in an invisible Chrome window instead. Slower, and it uses a lot more memory.",
  keep_raw: "Also keep the downloaded pages and PDFs themselves, not just their text. Takes a lot more disk space.",
  workers: "How many documents to work on at once. Leave it empty to use every processor core.",
  youtube_delay: "How long to wait between videos. Going faster makes it more likely YouTube blocks you for a while.",

  documents: "Pages and files saved as text so far.",
  chars: "How much text that adds up to.",
  waiting: "Links and files that haven't been processed yet.",
  failed: "Links and files where no text could be saved. The Documents tab shows why for each one.",

  "status-failed": "No text could be saved.",
  "status-skipped": "Left alone on purpose, like chat links, social media profiles and image files.",
  keys: "API keys are like passwords for outside services. Each one lets osiris get more, or get it faster, from that service.",

  "clean-report": "See each change one by one, and open any document to check it in context.",
  // documents and review
  "saved-text": "The text osiris saved. This is what gets searched and exported.",
  original: "The original file or page, as it's kept on this computer.",
  "open-md": "Open the saved text in a new tab.",
  "open-original": "Open the original file in a new tab.",
  "download-original": "Download the original file.",
  "web-page": "Go to the live page. It may have changed since it was saved, or be gone.",
  "prev-match": "Previous match (Shift+N)",
  "next-match": "Next match (N)",

  "doc-search": "Searches titles and web addresses. Tick \"Inside documents\" to search the text itself.",
  "doc-search-indexed": "Searches titles, web addresses and the text, best matches first.",

  "decide-unfixable": "Garbage that can't be repaired. It's left out of exports and off your to-do list.",
  "decide-undo": "Take back your decision.",
  score: "Garbage score: the longer the bar, the more likely the text is garbled.",
};
const LANE_HELP = {
  generic: "Ordinary web pages, and PDFs on the web.",

const JOB_PILL = {running: ["Running", "accent"], stopping: ["Stopping", "warn"], done: ["Finished", "good"], stopped: ["Stopped", "warn"], failed: ["Failed", "bad"]};
function renderState(s) {

    [fmt(s.documents), "documents", "documents"], [shortChars(s.chars), "characters of text", "chars"],
    [fmt(sum("pending")), "waiting", "waiting"], [fmt(sum("failed")), "failed", "failed"],

  ].map(([n, l, key]) => h("div", {class: "stat"}, h("b", {}, n), h("span", {}, term(l, help(key))))));

  const laneEl = $("#lanes");

    const names = Object.keys(lanes).sort((a, b) => (a === "skip") - (b === "skip") || Object.values(lanes[b]).reduce((x, y) => x + y, 0) - Object.values(lanes[a]).reduce((x, y) => x + y, 0));
    laneEl.replaceChildren(names.length ? h("table", {},
      h("thead", {}, h("tr", {}, h("th", {scope: "col"}, "Source"),
        [["Waiting", "pending"], ["Saved", "ok"], ["Thin", "thin"], ["Failed", "failed"], ["Skipped", "skipped"]].map(([c, st]) => h("th", {scope: "col"}, term(c, help("status-" + st)))))),
      h("tbody", {}, names.map(n => h("tr", {}, h("td", {}, term(LANE_LABEL[n] || n, LANE_HELP[n])),
        ["pending", "ok", "thin", "failed", "skipped"].map(st => { const v = lanes[n][st] || 0; return h("td", {class: v ? "" : "zero"}, fmt(v)); }))))
    ) : h("p", {class: "hint"}, "Nothing archived yet."));
  }

  const keys = $("#keys");
  const ix = s.index;
  if (keys) keys.replaceChildren("Saved in " + s.out + ". ", term("Keys found", help("keys")), ": "
    + (Object.entries(s.keys).filter(([, v]) => v).map(([k]) => k).join(", ") || "none") + ". ",
    ...(!ix ? []
       : ix.error ? [term("The search index", help("index")), " couldn't be updated: " + ix.error]
       : ix.updating && ix.total ? ["Updating the ", term("search index", help("index")), `: ${fmt(ix.done)} of ${fmt(ix.total)} documents checked.`]
       : [`${fmt(ix.documents)} documents in the `, term("search index", help("index")), "."]));
  renderProgress(s.job, lanes);

  const j = s.job;

  if (j.lines.length && $("#log")) {
    const log = $("#log"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 30;

    const pill = JOB_PILL[j.state];
    $("#progress-pill").replaceChildren(...(pill ? [h("span", {class: "pill " + pill[1]}, pill[0])] : []));
    for (const id of ["start", "review-scan", "export"]) $("#" + id).disabled = j.active;

  const c = $("#review-count");
  c.hidden = !s.review.to_review;

  if (Review.fixing && !j.active) { Review.fixing = false; if (currentTab === "review") Review.load(); }
  if (renderState.wasActive && !j.active) { reloadConfig(); Cleanup.refresh(); }  // a finished run clears the sites it retried
  renderState.wasActive = j.active;
}
/* progress of a run, from how many URLs it has finished and how many are left */
const Progress = {samples: [], job: null};
function renderProgress(j, lanes) {
  const box = $("#run-progress");
  if (!box) return;
  const p = j.progress;
  box.hidden = !p;
  if (!p) { Progress.samples = []; return; }
  if (Progress.job !== j.started) { Progress.job = j.started; Progress.samples = []; }
  const now = Date.now();
  Progress.samples.push([now, p.done]);
  while (Progress.samples.length > 2 && now - Progress.samples[0][0] > 180000) Progress.samples.shift();
  const all = p.done + p.waiting;
  $("#run-bar").style.width = (all ? Math.round(100 * p.done / all) : 0) + "%";
  const [t0, d0] = Progress.samples[0], seconds = (now - t0) / 1000, rate = seconds >= 20 ? (p.done - d0) / seconds : null;
  const youtube = lanes.youtube?.pending || 0;
  const parts = [`${fmt(p.done)} of ${fmt(all)} done`];
  if (!p.waiting) parts.push("now trying fallbacks for what failed or came back thin, then OCR");
  else if (youtube === p.waiting) parts.push("only YouTube is left, which goes one video at a time on purpose. Stopping is safe, and starting again resumes");
  else if (rate > 0) parts.push(`${rate < 10 ? rate.toFixed(1) : Math.round(rate)} a second`, "about " + duration(p.waiting / rate) + " left");
  else if (rate === 0 && seconds >= 120) parts.push("nothing finished in the last two minutes");
  $("#run-text").textContent = parts.filter(Boolean).join(" · ");
}
function duration(sec) {
  if (sec < 90) return "a minute";
  if (sec < 3600) return Math.round(sec / 60) + " minutes";
  const hours = Math.floor(sec / 3600), min = Math.round((sec % 3600) / 60);
  return hours >= 48 ? Math.round(hours / 24) + " days" : `${hours} h ${min} min`;
}

async function tick() {

  try { renderState(await api("/api/state?since=" + logSeen)); } catch (e) { /* the next tick retries */ }
}

            h("select", {"aria-label": "Why it failed", id: "doc-reason", title: help("doc-reason"), hidden: true, onchange: e => { this.reason = e.target.value; refresh(); }})),
          h("p", {class: "hint", id: "doc-help"}, 'All words must appear. "Quoted words" appear together, and -word leaves out documents with it.')),
        h("div", {class: "rows", id: "doc-rows"})),
      h("div", {class: "detail", id: "doc-detail"}, h("div", {class: "empty"}, h("h3", {}, "Choose a document"), h("p", {}, "Its saved text and original appear here."))));
  },
  load: guarded(async function (more) {
    const self = Docs;
    self.build();
    const seq = ++self.seq, off = more ? self.items.length : 0;
    const term = self.q.trim(), indexed = config.search_index;
    const ranked = indexed && !!term && !NO_TEXT.includes(self.status);
    const scan = !indexed && self.inText && term.length > 1 && !NO_TEXT.includes(self.status);
    $("#doc-help").hidden = !ranked;
    if (self.status === "failed") self.loadReasons();
    else $("#doc-reason").hidden = true;
    let r;
    if (ranked) {
      r = await api(`/api/search?q=${encodeURIComponent(term)}&lane=${self.lane}&status=${self.status}&offset=${off}`);
      const ix = r.index;
      self.note = (ix.updating && ix.total && ix.done < ix.total ? `Still building the search index (${fmt(ix.done)} of ${fmt(ix.total)}), so some matches are missing. ` : "")
        + `${fmt(r.total)} ${r.total === 1 ? "document matches" : "documents match"}, best first`;
      self.terms = r.terms;
    } else if (scan) {
      if (!more) $("#doc-rows").replaceChildren(h("div", {class: "more hint"}, "Searching…"));
      r = await api(`/api/search?q=${encodeURIComponent(term)}&lane=${self.lane}&status=${self.status}`);
      self.note = r.limited ? `The newest ${fmt(r.items.length)} matches. Search for something more specific to narrow it.`
        : `${fmt(r.items.length)} ${r.items.length === 1 ? "match" : "matches"} in ${fmt(r.searched)} documents`;
      self.terms = r.terms;
    } else {
      r = await api(`/api/documents?q=${encodeURIComponent(term)}&lane=${self.lane}&status=${self.status}&reason=${encodeURIComponent(self.reason)}&offset=${off}`);
      self.note = `${fmt(r.total)} documents` + (term ? ` with "${term}" in the URL or title` : "");
      self.terms = [];
    }
    if (seq !== self.seq) return;  // a newer search has started
    self.items = more ? [...self.items, ...r.items] : r.items;
    self.total = r.total; self.ranked = ranked || scan;
    self.renderList();
  }),
  async loadReasons() {
    const r = await api(`/api/reasons?lane=${this.lane}`);
    const sel = $("#doc-reason");
    sel.hidden = false;
    sel.replaceChildren(h("option", {value: ""}, "Any reason"), ...r.reasons.map(x => h("option", {value: x.reason, selected: x.reason === this.reason,
      title: explainReason(x.reason)}, `${reasonLabel(x.reason)} (${fmt(x.count)})`)));
  },
  renderList() {
    const rows = $("#doc-rows");
    rows.replaceChildren(h("div", {class: "hint", style: "padding:6px 12px", role: "status"}, this.note),
      ...this.items.map((it, i) => h("button", {class: "row", "aria-current": i === this.at, onclick: () => this.open(i)},
        h("div", {class: "title"}, it.title || it.url),
        h("div", {class: "sub"}, h("span", {}, it.host), h("span", {class: "right", title: [help("status-" + it.status), it.status === "failed" ? explainReason(it.reason) : ""].filter(Boolean).join(" ")},
          it.status === "ok" ? shortChars(it.chars) + " chars" : it.reason ? `${it.status}: ${reasonLabel(it.reason)}` : it.status)),
        it.snippet && h("div", {class: "snippet"}, it.snippet.map(([text, hit]) => hit ? h("mark", {}, text) : text)))));
    if (this.total > this.items.length) rows.append(h("div", {class: "more"}, h("button", {class: "btn", onclick: () => this.load(true)}, "Show more")));
  },
  open: guarded(async function (i) {
    const self = Docs;
    const it = self.items[i];
    if (!it) return;
    self.at = i;
    for (const [n, el] of [...$("#doc-rows").querySelectorAll(".row")].entries()) el.setAttribute("aria-current", n === i);
    $("#doc-rows").querySelectorAll(".row")[i]?.scrollIntoView({block: "nearest"});
    await self.show(it.id, self.ranked ? self.terms : []);
  }),
  async show(id, terms = []) {
    this.build();
    const d = await api("/api/document/" + id);
    renderDetail($("#doc-detail"), d, {terms});
    setHash("documents/" + id);
  },
};

/* ---- address: #review, #documents, #documents/<id> ---- */
function setHash(value) { if (location.hash.slice(1) !== value) history.replaceState(null, "", "#" + value); }
function followHash() {
  const [tab, id] = location.hash.slice(1).split("/");
  if (!["archive", "review", "documents"].includes(tab)) return;
  showTab(tab);
  if (tab === "documents" && /^[0-9a-f]{16}$/.test(id || "")) guarded(() => Docs.show(id))();
}
window.addEventListener("hashchange", followHash);

/* ---- keys ---- */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || $("#picker").open || $("#report").open) return;
  const typing = e.target.matches("input, select, textarea");
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  const go = {j: 1, ArrowDown: 1, k: -1, ArrowUp: -1}[e.key];
  if (currentTab === "documents") {
    if (go && e.target.closest(".body")) return;  // arrows scroll the text
    if (go) { e.preventDefault(); const n = Docs.at + go; if (n >= 0 && n < Docs.items.length) Docs.open(n); return; }
    if (e.key === "/") { e.preventDefault(); $("#doc-q")?.focus(); $("#doc-q")?.select(); return; }
    if (e.key === "n" && Matches.go) { e.preventDefault(); Matches.go(1); return; }
    if (e.key === "N" && Matches.go) { e.preventDefault(); Matches.go(-1); }
    return;
  }
  if (currentTab !== "review") return;
  if (go) { e.preventDefault(); Review.step(go); return; }
  const decision = {f: "fine", b: "bad", o: "ocr", r: "refetch", x: "unfixable"}[e.key];
  const blocked = (decision === "ocr" && !Review.doc?.pdf) || (decision === "refetch" && Review.doc?.lane === "singlefile");
  if (decision && !blocked) { e.preventDefault(); guarded(() => Review.decide(decision))(); return; }
  if (e.key === "u" && Review.doc?.decision) { e.preventDefault(); guarded(() => Review.decide(null))(); }
  if (e.key === "n") { e.preventDefault(); $("#review-note")?.focus(); }
});

/* ---- start ---- */
(async () => {
  try {
    config = await api("/api/config");
    for (const b of document.querySelectorAll("nav button")) b.title = help("tab-" + b.dataset.tab);
    $("#review-count").title = help("review-count");
    renderArchive();
    Cleanup.refresh();
    followHash();
    await tick();
    setInterval(tick, 1500);
  } catch (e) { $("#archive-column").replaceChildren(h("div", {class: "notice warn"}, "Couldn't reach osiris. Is it still running?")); }
})();
</script>
