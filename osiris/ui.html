<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osiris</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f1ed; --panel: #ffffff; --sunk: #ebe9e3; --line: #cfcbc1; --line-strong: #858075;
  --text: #141412; --muted: #4c4942; --accent: #1d4f9c; --accent-text: #ffffff; --accent-soft: #d9e5f7;
  --good: #1b5e36; --good-soft: #dbeee1; --warn: #734400; --warn-soft: #f6e4c4; --bad: #9c2217; --bad-soft: #f8dcd8;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111113; --panel: #1c1c20; --sunk: #17171a; --line: #3e3e46; --line-strong: #7a7a83;
    --text: #f5f3ef; --muted: #c6c2b8; --accent: #96bdf3; --accent-text: #0a0f17; --accent-soft: #22354f;
    --good: #84d9a7; --good-soft: #163020; --warn: #f2c070; --warn-soft: #3a2c11; --bad: #ff9d92; --bad-soft: #44211e;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 20px; padding: 0 16px 0 4px; height: 48px; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
nav { display: flex; gap: 2px; height: 100%; }
nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 0 13px; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 6px; }
nav button:hover { color: var(--text); }
nav button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }
nav button:hover { background: var(--sunk); }
.count { background: var(--sunk); border-radius: 9px; padding: 0 6px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
#jobline { margin-left: auto; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
main { flex: 1; min-height: 0; overflow: hidden; }
.tab { height: 100%; display: none; }
.tab.on { display: flex; }

/* archive tab */
#archive { overflow-y: auto; justify-content: center; }
.column { width: 100%; max-width: 900px; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 15px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 15px 16px; }
.card > h2 { font-size: 14px; font-weight: 650; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
.stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat span { color: var(--muted); font-size: 13.5px; }
.source { padding: 10px 0; border-top: 1px solid var(--line); }
.source:first-of-type { border-top: 0; padding-top: 0; }
.source-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.source-head h3 { font-size: 14.5px; font-weight: 600; }
.source-head p { color: var(--muted); font-size: 13.5px; }
.folder { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 0 0; font-size: 14px; }
.folder code { font: 13.5px var(--mono); overflow-wrap: anywhere; }
.folder .note { color: var(--muted); font-size: 13.5px; order: 3; flex-basis: 100%; }
.folder .btn.link { margin-left: auto; }
.folder .note.bad { color: var(--bad); }
.btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; color: var(--text); }
.btn:hover:not(:disabled) { background: var(--sunk); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; padding: 7px 16px; }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.link { background: none; border: 0; color: var(--muted); padding: 0 4px; text-decoration: underline; }
.btn kbd { font: 12px var(--mono); color: var(--muted); margin-left: 4px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .row:focus-visible, .body:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
label.opt { display: flex; align-items: center; gap: 7px; }
label.opt input[type=text], label.opt input[type=number], label.opt select { flex: 1; min-width: 0; }
input[type=text], input[type=number], input[type=search], select { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 13px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong); border-radius: 15px; padding: 2px 10px 2px 7px; cursor: pointer; font-size: 14px; }
.chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chip input { margin: 0; }
.group { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
.group:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
.group > h3 { font-size: 13.5px; font-weight: 650; color: var(--muted); margin-bottom: 8px; }
.group .chips { margin-bottom: 0; }
.ticks { display: flex; flex-wrap: wrap; gap: 5px 26px; }
.ticks + .numbers, .ticks + .fields, .numbers + .fields, .fields + .numbers, .numbers + .limits, .fields + .limits { margin-top: 9px; }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 6px 30px; }
.number { display: flex; align-items: center; gap: 8px; }
.number > span:first-child { flex: 1; min-width: 0; }
.unit { color: var(--muted); font-size: 13.5px; width: 2.7em; flex: none; }
input.short { width: 5.6em; flex: none; }
.fields { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 14px; align-items: start; }
.field-name { padding-top: 3px; }
.field-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.field-controls input[type=text] { flex: 1; min-width: 160px; }
.field-controls .note { flex-basis: 100%; color: var(--muted); font-size: 13.5px; }
.field-controls .note.bad { color: var(--bad); }
input[readonly] { background: var(--sunk); }
.limits > p { margin-bottom: 5px; }
.limit { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 5px; }
.limit input[type=text] { flex: 1; min-width: 160px; }
.reset-row { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
details { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
details summary { cursor: pointer; color: var(--text); font-size: 14.5px; font-weight: 650; }
details > .group:first-of-type { margin-top: 11px; padding-top: 0; border-top: 0; }
.hint { color: var(--muted); font-size: 13.5px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 13.5px; padding: 2px 0 6px 13px; }
td { text-align: right; padding: 3px 0 3px 13px; border-top: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td.zero { color: var(--line-strong); }
#log { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; font: 10px/1.5 var(--mono); padding: 8px 10px; height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.status-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.pill { font-size: 13px; padding: 1px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

/* two-pane tabs */
.list-pane { width: 40%; min-width: 300px; max-width: 520px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); min-height: 0; }
.list-tools { padding: 10px 13px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; flex: none; }
.segments { display: flex; flex-wrap: wrap; gap: 4px; }
.segments button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--muted); font-size: 14px; }
.segments button:hover { background: var(--sunk); }
.segments button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 650; }
.tool-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tool-row select, .tool-row input { min-width: 0; flex: 1; }
.tool-row select { min-width: 8.5em; }  /* wrap to a new line rather than cut off the choice */
.rows { flex: 1; overflow-y: auto; min-height: 0; }
.row { display: block; width: 100%; background: none; text-align: left; border: 0; border-bottom: 1px solid var(--line); padding: 8px 13px; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row[aria-current=true] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.row .title { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13.5px; margin-top: 1px; }
.row .sub span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub .right { margin-left: auto; flex: none; }
.row .snippet { color: var(--muted); font-size: 13.5px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.scorebar { width: 42px; height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; flex: none; }
.scorebar i { display: block; height: 100%; background: var(--bad); }
.more { padding: 10px; text-align: center; }
.list-tools .chips { margin-bottom: 0; gap: 4px; }
.list-tools .chip { font-size: 12px; padding: 1px 8px 1px 5px; }
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.empty { margin: auto; color: var(--muted); text-align: center; padding: 24px; max-width: 420px; }
.empty h3 { color: var(--text); font-size: 16px; margin-bottom: 4px; }
.empty .btn { margin-top: 13px; }
.detail-head { padding: 13px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; display: flex; flex-direction: column; gap: 6px; }
.detail-head h2 { font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; color: var(--muted); font-size: 13.5px; }
.meta a { color: var(--accent); overflow-wrap: anywhere; }
.decide-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.decide-row input { flex: 1; min-width: 120px; }
.btn[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 650; }
.view-switch { display: flex; gap: 4px; }
.body { flex: 1; min-height: 0; overflow: auto; padding: 15px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.55; }
.body.mono { font: 13.5px/1.55 var(--mono); }
.versions { flex: 1; min-height: 0; display: flex; }
.version { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.version + .version { border-left: 1px solid var(--line); }
.version-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 13.5px; }
.version-head b { color: var(--text); font-size: 14.5px; }
.version-head .btn { margin-left: auto; }
.frame { flex: 1; border: 0; width: 100%; min-height: 0; background: #fff; }
.notice { margin: 16px; padding: 10px 13px; background: var(--sunk); border-radius: 6px; color: var(--muted); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.banner { padding: 7px 13px; background: var(--accent-soft); display: flex; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-size: 14px; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
.picker-head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.picker-head h3 { font-size: 15px; }
.picker-head input { width: 100%; font: 13.5px var(--mono); }
.picker-list { height: 320px; overflow-y: auto; }
.picker-list button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 15px; cursor: pointer; overflow-wrap: anywhere; }
.picker-list button:hover { background: var(--sunk); }
.picker-foot { padding: 10px 15px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.picker-foot .hint { flex: 1; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin: 2px 0 6px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
.progress-text { color: var(--muted); font-size: 13.5px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; box-shadow: 0 0 0 1px var(--warn-soft); }
mark.here { background: var(--warn); color: var(--panel); box-shadow: 0 0 0 1px var(--warn); }
.explain { padding: 9px 12px; background: var(--bad-soft); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.explain .actions { gap: 6px; }
.matches { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; margin-left: auto; font-variant-numeric: tabular-nums; }
.head-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.retry-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 13px; font-size: 14px; }
.retry-list .chip { cursor: default; padding-right: 4px; }
.retry-list .chip button { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; }
#report { width: min(960px, calc(100vw - 32px)); }
#fail-list { width: min(860px, calc(100vw - 32px)); }
.fail-row { cursor: pointer; }
.fail-row:hover { background: var(--sunk); }
.fail-group td { font-weight: 650; }
.fail-name { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--text); text-align: left; }
.fail-row .hint { font-weight: 400; margin-left: 6px; }
.fail-section { position: sticky; top: 0; background: var(--sunk); padding: 4px 15px; font-size: 13.5px; font-weight: 650; border-bottom: 1px solid var(--line); }
.fail-url { overflow-wrap: anywhere; }
.report-list { height: min(60vh, 560px); overflow-y: auto; }
.report-row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 15px; cursor: pointer; color: var(--text); }
.report-row:hover { background: var(--sunk); }
.report-row .change { font: 13.5px var(--mono); overflow-wrap: anywhere; }
.report-row .change del { text-decoration: none; background: var(--bad-soft); color: var(--bad); border-radius: 2px; }
.report-row .change ins { text-decoration: none; background: var(--good-soft); color: var(--good); border-radius: 2px; }
.report-row .context { color: var(--muted); font-size: 13.5px; margin-top: 2px; overflow-wrap: anywhere; }
.report-row .where { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.sym { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 2px; margin: 0 1px; }
.term { text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; cursor: help; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 6px 15px; border-radius: 6px; display: none; z-index: 10; max-width: calc(100vw - 32px); }
@media (max-width: 760px) {
  .tab.on.split { flex-direction: column; }
  .versions { flex-direction: column; }
  .version + .version { border-left: 0; border-top: 1px solid var(--line); }
  .list-pane { width: 100%; max-width: none; height: 45%; border-right: 0; border-bottom: 1px solid var(--line); }
  #jobline { display: none; }
}
@media (max-width: 560px) {
  .numbers { grid-template-columns: minmax(0, 1fr); }
  .fields { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .field-controls { margin-bottom: 7px; }
}
</style>
</head>
<body>
<header>
  <nav role="tablist">
    <button role="tab" data-tab="archive" aria-selected="true">Archive</button>
    <button role="tab" data-tab="documents" aria-selected="false">Documents <span class="count" id="review-count" hidden></span></button>
  </nav>
  <div id="jobline"></div>
</header>
<main>
  <section class="tab on" id="archive"><div class="column" id="archive-column"></div></section>
  <section class="tab split" id="documents"></section>
</main>
<dialog id="picker"></dialog>
<dialog id="report" aria-label="Cleanup report"></dialog>
<dialog id="fail-list" aria-label="Failed documents"></dialog>
<div id="toast" role="status"></div>
<script>
"use strict";
const $ = (s, root = document) => root.querySelector(s);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("aria-") && typeof v === "boolean") { el.setAttribute(k, String(v)); continue; }  // aria-pressed="true", not ""
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value" || k === "checked" || k === "disabled" || k === "hidden") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
}
function fill(el, ...kids) { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }
const fmt = n => (n ?? 0).toLocaleString("en-US");
const shortChars = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n ?? 0);
function toast(text) { const t = $("#toast"); t.textContent = text; t.style.display = "block"; clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 3500); }
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!res.ok) { const text = await res.text(); throw new Error(text || res.statusText); }
  return res.json();
}
const guarded = fn => async (...args) => { try { return await fn(...args); } catch (e) { toast(e.message); } };

/* ---- tabs ---- */
let currentTab = "archive";
function showTab(name) {
  currentTab = name;
  if (name !== "documents" || !location.hash.startsWith("#documents/")) setHash(name);
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", b.dataset.tab === name);
  for (const s of document.querySelectorAll(".tab")) s.classList.toggle("on", s.id === name);
  if (name === "documents") Docs.load();
}
for (const b of document.querySelectorAll("nav button")) b.addEventListener("click", () => showTab(b.dataset.tab));

/* ---- explanations, shown when you hover ---- */
const HELP = {
  // tabs
  "tab-archive": "Choose what to save, then turn it into searchable text.",
  "tab-documents": "Browse and search everything you've saved, find what came out garbled, and fix it.",
  "review-count": "Documents that might be garbled and that you haven't decided on yet.",
  // archive tab
  start: "Go through everything you've added, and fetch or read whatever isn't saved yet. Anything already saved is skipped, so it's fine to press this again.",
  stop: "Pause the current job. Everything done so far is kept, and starting again carries on from there. Press again to stop right away.",
  "review-scan": "Look through your saved documents for text that came out garbled, like broken characters or \"please enable JavaScript\" pages. This only reads them, it doesn't change anything.",
  export: "Put all your saved documents into one file, corpus.jsonl, for other tools to load. Documents you marked Bad are left out.",
  "add-folder": "Pick a folder on this computer to include.",
  "remove-folder": "Stop including this folder. Nothing inside it is touched.",
  ocr: "Some PDFs are just pictures of pages, with no text inside. This reads the words off the pictures (that's OCR). It's slow, so it runs after everything else.",
  ocr_lang: "The languages your scanned PDFs are in, joined with +, like eng+tur. Each language needs its Tesseract language pack installed.",
  refresh: "Read PDFs you've already saved once more, in case they come out better now. A document is only replaced if the new copy has more text.",
  retry_failed: "Give every link that failed before another try. Without this, failed links are left alone.",
  review_after: "When archiving is done, check for garbled text right away.",
  advanced: "Finer control over how a run behaves. The numbers already filled in are the defaults.",
  cookies: "A file with your browser's cookies. With it, osiris can open pages as you see them when you're logged in. Keep this file private.",

function sourceHelp(source) {
  if (!source) return "";
  let parts = source.split(":"), first;
  if (parts[0] === "file" && FILE_KIND[parts[1]]) { first = FILE_KIND[parts[1]]; parts = parts.slice(2); }
  else { first = SOURCE_WHAT[parts[0]] ?? "Where the text came from"; parts = parts.slice(1); }
  const rest = parts.map(part => {
    const names = part.split("+");
    return names.every(n => PROVIDER[n]) ? "from " + names.map(n => PROVIDER[n]).join(" and ") : SOURCE_HOW[part];

  return `${first}${rest.length ? ", " + rest.join(", ") : ""}. (${source})`;
}

/* how far a run is. Sources run side by side, each on its own schedule, so a run lasts as long as its
   slowest source. Stages inside a source (arXiv's abstracts, then its full text) run one after the other. */
const PACE_WINDOW = 180000;  // how much recent progress a pace is measured over
const STAGE_LABEL = {...LANE_LABEL, arxiv: "arXiv abstracts", full_text: "arXiv full text", refresh_web: "Web PDFs read again", fallbacks: "Fallbacks for web pages", ocr: "OCR"};
const Progress = {stages: {}, job: null};
function renderProgress(j) {
  const box = $("#run-progress");
  if (!box) return;
  const p = j.progress;
  box.hidden = !p;
  if (!p) { Progress.stages = {}; return; }
  if (Progress.job !== j.started) { Progress.job = j.started; Progress.stages = {}; }
  const all = p.done + p.waiting;
  $("#run-bar").style.width = (all ? Math.floor(100 * p.done / all) : 0) + "%";  // full only when nothing is left
  const parts = [`${fmt(p.done)} of ${fmt(all)} done`];
  if (p.waiting) parts.push(...timeLeft(p.stages));
  else parts.push("finishing up");
  $("#run-text").textContent = parts.filter(Boolean).join(" · ");
}
/* Seconds per item: what the stage last really took, but never quicker than its schedule allows. */
function stagePace(st, seen, now) {
  const [t0, left0] = seen.samples[0], seconds = (now - t0) / 1000;
  if (seconds >= 20 && left0 > st.left) seen.measured = seconds / (left0 - st.left);
  return Math.max(st.each || 0, seen.measured || 0);
}
function timeLeft(stages) {
  const now = Date.now(), seconds = {}, shown = [], measuring = [], current = new Set();
  for (const st of stages) {
    const label = STAGE_LABEL[st.stage];
    if (!st.left) { delete Progress.stages[st.stage]; continue; }
    let each = st.each;
    if (current.has(st.source)) delete Progress.stages[st.stage];  // its turn hasn't come
    else {
      current.add(st.source);
      const seen = Progress.stages[st.stage] ??= {samples: []};
      seen.samples.push([now, st.left]);
      while (seen.samples.length > 2 && now - seen.samples[0][0] > PACE_WINDOW) seen.samples.shift();
      each = stagePace(st, seen, now);
    }
    if (!each) { measuring.push(label); continue; }
    seconds[st.source] = (seconds[st.source] || 0) + st.left * each;
    shown.push([label, st.left * each]);
  }
  const longest = Math.max(0, ...Object.values(seconds));
  shown.sort((a, b) => b[1] - a[1]);
  return [
    longest && "about " + duration(longest) + " left",
    shown.length > 1 && shown.map(([label, sec]) => `${label} ${duration(sec)}`).join(", "),
    measuring.length && "still measuring " + measuring.join(", "),
  ];
}
function duration(sec) {
  if (sec < 90) return "a minute";
  if (sec < 3600) return Math.round(sec / 60) + " minutes";
  const hours = Math.floor(sec / 3600), min = Math.round((sec % 3600) / 60);
  return hours >= 48 ? Math.round(hours / 24) + " days" : `${hours} h ${min} min`;
}

function markedBody(text, terms) {

function followHash() {
  const [tab, id] = location.hash.slice(1).split("/");
  if (tab === "review") { Docs.garbage = true; showTab("documents"); return; }  // where the Review tab was
  if (!["archive", "documents"].includes(tab)) return;
  showTab(tab);
  if (tab === "documents" && /^[0-9a-f]{16}$/.test(id || "")) guarded(() => Docs.show(id))();
}
window.addEventListener("hashchange", followHash);

/* ---- keys ---- */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector("dialog[open]")) return;
  const typing = e.target.matches("input, select, textarea");
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  const go = {j: 1, ArrowDown: 1, k: -1, ArrowUp: -1}[e.key];
  if (currentTab !== "documents") return;
  if (go && e.target.closest(".body")) return;  // arrows scroll the text
  if (go) { e.preventDefault(); Docs.step(go); return; }
  if (e.key === "/") { e.preventDefault(); $("#doc-q")?.focus(); $("#doc-q")?.select(); return; }
  if (e.key === "n" && Matches.go) { e.preventDefault(); Matches.go(1); return; }
  if (e.key === "N" && Matches.go) { e.preventDefault(); Matches.go(-1); }
});

/* ---- start ---- */
(async () => {
  try {
    config = await api("/api/config");
    for (const b of document.querySelectorAll("nav button")) b.title = help("tab-" + b.dataset.tab);
    $("#review-count").title = help("review-count");
    renderArchive();
    Cleanup.refresh();
    followHash();
    await tick();
    setInterval(tick, 1500);
  } catch (e) { $("#archive-column").replaceChildren(h("div", {class: "notice warn"}, "Couldn't reach osiris. Is it still running?")); }
})();
</script>
